[tools]
java = "25"
maven = "3"
python = "3"

[env]
_.python.venv = ".venv"

[tasks."mvn:validate"]
description = "Run Maven Validate"
dir = "./lib"
run = "mvn clean validate"

[tasks."mvn:format"]
description = "Format pom.xml and Java code"
dir = "./lib"
run = [
    "mvn spotless:apply",
]

[tasks.megalint]
description = "Megalint with Java flavor"
run = "podman run --rm -v $(pwd):/tmp/lint:rw oxsecurity/megalinter-java"
