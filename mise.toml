[tools]
python = "3.15"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.format]
description = "Format pom.xml and Java code"
dir = "./lib"
run = "mvn spotless:apply"

[tasks.compile]
description = "Compile and Spotbugs"
dir = "./lib"
run = "mvn clean test-compile spotbugs:check"

[tasks.test]
description = "Format and test"
dir = "./lib"
run = "mise format && mvn clean test"

[tasks.megalint]
description = "Megalint with Java flavor"
run = "podman run --rm -v $(pwd):/tmp/lint:rw docker.io/oxsecurity/megalinter-java"
