# MegaLinter configuration file
# More info at https://megalinter.io
---
# Configuration documentation: https://megalinter.io/latest/configuration/
# Linters documentation: https://megalinter.io/latest/descriptors/

# All available variables are described in documentation
# https://megalinter.io/latest/configuration/#all-available-variables
APPLY_FIXES: none
PRINT_ALL_FILES: true
LOG_FILE: none
FLAVOR_SUGGESTIONS: false
SECURITY_SUGGESTIONS: false
IGNORE_GITIGNORED_FILES: true
ADDITIONAL_EXCLUDED_DIRECTORIES: [examples]
CLEAR_REPORT_FOLDER: true

LOG_LEVEL: DEBUG
FAIL_IF_MISSING_LINTER_IN_FLAVOR: true
ENABLE_LINTERS:
  - JAVA_CHECKSTYLE
  - JAVA_PMD
  - YAML_PRETTIER
  - YAML_YAMLLINT
  - XML_XMLLINT

JAVA_CHECKSTYLE_CONFIG_FILE: google-checks.xml
JAVA_CHECKSTYLE_FILTER_REGEX_INCLUDE: (lib/src/main/java)
JAVA_CHECKSTYLE_FILTER_REGEX_EXCLUDE: (package-info\.java)
JAVA_PMD_CONFIG_FILE: pmd-ruleset.xml
JAVA_PMD_FILTER_REGEX_INCLUDE: (lib/src/main/java)
JAVA_PMD_FILTER_REGEX_EXCLUDE: (package-info\.java)

MARKDOWN_SUMMARY_REPORTER: false
CONSOLE_REPORTER: false
GITHUB_COMMENT_REPORTER: true
REPORTERS_MARKDOWN_TYPE: simple
GITHUB_STATUS_REPORTER: true
SARIF_REPORTER: true
CONFIG_REPORTER: false
UPDATED_SOURCES_REPORTER: false
