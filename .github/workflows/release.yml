name: Release and Upload Pages

on:
  workflow_dispatch:

jobs:
  release:
    name: Release
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./lib
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'
          server-id: central
          server-username: SONAR_USERNAME
          server-password: SONAR_PASSWORD
          cache: maven
      - name: Set the old tag
        id: old_tag
        run: |
          OLD_TAG=$(git describe --tags --abbrev=0)
          echo "Old tag: $OLD_TAG"
          echo "tag=$OLD_TAG" >> $GITHUB_OUTPUT
      # Post JARs to Maven Central
      - name: Release to Maven Central
        env:
          SONAR_USERNAME: ${{ secrets.SONAR_USERNAME }}
          SONAR_PASSWORD: ${{ secrets.SONAR_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          export GPG_TTY=$(tty)
          git config --global user.name "GitHub Actions"
          git config --global user.email "olsson.erik1993@gmail.com"
          mvn -B --file pom.xml release:prepare
          mvn -B --file pom.xml release:perform
          git push origin main --tags
      # Upload GitHub pages
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./lib/target/site
      # Deploy GitHub pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # Set the new tag
      - name: Set the new tag
        id: new_tag
        run: |
          NEW_TAG=$(git describe --tags --abbrev=0)
          echo "New tag: $NEW_TAG"
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
      # Build Github Changelog
      - name: Build Github Changelog
        id: github_release
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          fromTag: "${{ steps.old_tag.outputs.tag }}"
          toTag: "${{ steps.new_tag.outputs.tag }}"
          mode: "PR"
          configurationJson: |
            {
              "template": "## 📝 Release Notes\n\n#{{CHANGELOG}}",
              "categories": [
                {
                    "title": "## 💬 Other",
                    "labels": ["other", "docs" ]
                },
                {
                    "title": "## 🚀 Features",
                    "labels": ["feature"]
                },
                {
                    "title": "## 🐛 Bugfixes",
                    "labels": ["bug", "bugfix"]
                },
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.new_tag.outputs.tag }}
          body: ${{steps.github_release.outputs.changelog}}