---

name: Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'SemVer Release Type'
        required: true
        default: 'Patch'
        type: choice
        options:
          - Major
          - Minor
          - Patch

jobs:
  release:
    name: Maven Release & Upload Artifact to Maven Central
    runs-on: ubuntu-latest
    outputs:
      previous_tag: ${{ steps.set_previous_tag.outputs.previous_tag }}
      current_tag: ${{ steps.set_current_tag.outputs.current_tag }}
    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Configure Git User
        # language=bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Java
        # https://github.com/actions/setup-java
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'zulu'
          server-id: central
          server-username: SONAR_USERNAME
          server-password: SONAR_PASSWORD
          cache: maven

      - name: Set previous Git tag for GitHub Release
        id: set_previous_tag
        # language=bash
        run: |
          TAG=$(git describe --tags --abbrev=0)
          echo "PREVIOUS_TAG: $TAG"
          echo "previous_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Determine Maven Version Type (projectVersionPolicyId)
        id: determine_version_type
        env:
          VERSION_TYPE: ${{ github.event.inputs.version_type }}
        # language=bash
        run: |
          case "$VERSION_TYPE" in
            Major)
              RELEASE_TYPE="SemVerMajorDevelopment"
              ;;
            Minor)
              RELEASE_TYPE="SemVerMinorDevelopment"
              ;;
            Patch)
              RELEASE_TYPE="SemVerPatchDevelopment"
              ;;
            *)
              echo "Unknown version type: $VERSION_TYPE"
              exit 1
              ;;
          esac
          echo "VERSION_POLICY=$RELEASE_TYPE" >> $GITHUB_ENV
          echo "projectVersionPolicyId: $RELEASE_TYPE"

      - name: Release to Maven Central
        env:
          SONAR_USERNAME: ${{ secrets.SONAR_USERNAME }}
          SONAR_PASSWORD: ${{ secrets.SONAR_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        # language=bash
        run: |
          MAVEN_ARGS="-B -V -e -ntp -Dstyle.color=always -DskipTests=true -f lib/pom.xml"
          RELEASE_ARGS="-Darguments=-B -V -e -ntp -Dstyle.color=always -DskipTests=true"
          mvn ${MAVEN_ARGS} \
          -DprojectVersionPolicyId=${{ env.VERSION_POLICY }} \
          "${RELEASE_ARGS}" \
          release:prepare release:perform
          git push origin main --tags

      - name: Set the Current Git tag for GitHub Release
        id: set_current_tag
        # language=bash
        run: |
          TAG=$(git describe --tags --abbrev=0)
          echo "CURRENT_TAG: $TAG"
          echo "current_tag=$TAG" >> $GITHUB_OUTPUT

  deploy_pages:
    name: Deploy Maven Site to GitHub Pages
    needs: release
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.current_tag }}
          fetch-depth: 0

      - name: Setup Java
        # https://github.com/actions/setup-java
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'zulu'
          cache: maven

      - name: Build site
        # language=bash
        run: |
          MAVEN_ARGS="-B -V -e -ntp -Dstyle.color=always -f lib/pom.xml"
          mvn ${MAVEN_ARGS} clean test site

      - name: Upload Pages Artifact
        # https://github.com/actions/upload-pages-artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./lib/target/site

      - name: Deploy to GitHub Pages
        id: deployment
        # https://github.com/actions/deploy-pages
        uses: actions/deploy-pages@v5

  create_github_release:
    name: Create GitHub Release
    needs: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build Github Changelog
        id: github_release
        # https://github.com/mikepenz/release-changelog-builder-action
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          fromTag: "${{ needs.release.outputs.previous_tag }}"
          toTag: "${{ needs.release.outputs.current_tag }}"
          mode: "PR"
          owner: "mangila"
          repo: "ensure4j"
          # language=JSON
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}",
              "categories": [
                {
                  "title": "## New Features ",
                  "labels": [
                    "feat"]
                },
                {
                  "title": "## Docs 📝",
                  "labels": [
                    "docs"]
                },
                {
                  "title": "## Test 🧪",
                  "labels": [
                    "test"
                  ]
                },
                {
                  "title": "## Dependency 📦",
                  "labels": [
                    "dependencies"]
                },
                {
                  "title": "## Other 🔧 🧹 ⚙️",
                  "labels": [
                    "chore"]
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        # https://github.com/softprops/action-gh-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.current_tag }}
          body: ${{steps.github_release.outputs.changelog}}