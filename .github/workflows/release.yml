name: release

on:
  workflow_dispatch:

jobs:
  release:
    name: Release
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./lib
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'
          server-id: central
          server-username: SONAR_USERNAME
          server-password: SONAR_PASSWORD
          cache: maven
      # Post JARs to Maven Central
      - name: Release to Maven Central
        env:
          SONAR_USERNAME: ${{ secrets.SONAR_USERNAME }}
          SONAR_PASSWORD: ${{ secrets.SONAR_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          export GPG_TTY=$(tty)
          git config --global user.name "GitHub Actions"
          git config --global user.email "olsson.erik1993@gmail.com"
          mvn -B --file pom.xml release:prepare
          mvn -B --file pom.xml release:perform
          git push origin main --tags
      # Upload GitHub pages
      - name: Upload Pages Artifact
        id: deployment
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./lib/target/site
      # Deploy GitHub pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4