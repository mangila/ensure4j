---

name: Release and Upload Pages

on:
  workflow_dispatch:

jobs:
  release:
    name: Release
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./lib
    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        # https://github.com/actions/setup-java
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'zulu'
          server-id: central
          server-username: SONAR_USERNAME
          server-password: SONAR_PASSWORD
          cache: maven

      - name: Set previous Git tag for GitHub Release
        id: previous_tag
        # language=bash
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0)
          echo "PREVIOUS_TAG: $PREVIOUS_TAG"
          echo "tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT

      - name: Release to Maven Central
        env:
          SONAR_USERNAME: ${{ secrets.SONAR_USERNAME }}
          SONAR_PASSWORD: ${{ secrets.SONAR_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        # language=bash
        run: |
          export GPG_TTY=$(tty)
          git config --global user.name "GitHub Actions"
          git config --global user.email "olsson.erik1993@gmail.com"
          mvn -B --no-transfer-progress --file pom.xml release:prepare
          mvn -B --no-transfer-progress --file pom.xml release:perform
          git push origin main --tags

      - name: Upload Pages Artifact
        # https://github.com/actions/upload-pages-artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./lib/target/site

      - name: Deploy to GitHub Pages
        id: deployment
        # https://github.com/actions/deploy-pages
        uses: actions/deploy-pages@v5
        # Set the new tag
      - name: Set the Current Git tag for GitHub Release
        id: current_tag
        # language=bash
        run: |
          CURRENT_TAG=$(git describe --tags --abbrev=0)
          echo "CURRENT_TAG: $CURRENT_TAG"
          echo "tag=$CURRENT_TAG" >> $GITHUB_OUTPUT

      - name: Build Github Changelog
        id: github_release
        # https://github.com/mikepenz/release-changelog-builder-action
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          fromTag: "${{ steps.previous_tag.outputs.tag }}"
          toTag: "${{ steps.current_tag.outputs.tag }}"
          mode: "PR"
          owner: "mangila"
          repository: "ensure4j"
          # language=JSON
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}",
              "categories": [
                {
                  "title": "## New Features ",
                  "labels": ["feat"]
                },
                {
                  "title": "## Docs 📝",
                  "labels": ["docs"]
                },
                {
                  "title": "## Test 🧪",
                  "labels": ["test"]
                },
                {
                  "title": "## Dependency 📦",
                  "labels": ["dependencies"]
                },
                {
                  "title": "## Other 🔧 🧹 ⚙️",
                  "labels": ["chore"]
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        # https://github.com/softprops/action-gh-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.current_tag.outputs.tag }}
          body: ${{steps.github_release.outputs.changelog}}