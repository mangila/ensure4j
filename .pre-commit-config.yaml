fail_fast: false
repos:
  - repo: local
    hooks:
      - id: mvn-compile-java-17-ensure4j
        name: Maven Backward Compatibility Check
        entry: mise mvn:compile:17
        language: system
        files: ^lib/src
        require_serial: true
        pass_filenames: false
      - id: mvn-test-ensure4j
        name: Maven Test ensure4j
        entry: mise mvn:test
        language: system
        files: ^lib/src
        require_serial: true
        pass_filenames: false